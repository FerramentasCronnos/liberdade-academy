# Stack Liberdade Academy — use no Portainer (Git / upload do repo raiz)
# Compose path: docker-compose.yml

name: liberdade-academy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: liberdade_academy
      POSTGRES_USER: liberdade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liberdade}
    ports:
      # 5433 no host: a 5432 costuma estar tomada por um Postgres nativo
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - liberdade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liberdade -d liberdade_academy"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - liberdade
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://liberdade:${POSTGRES_PASSWORD:-liberdade}@postgres:5432/liberdade_academy?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao}
      PORT: 3000
      HOST: 0.0.0.0
      CATALOG_PROVIDER: ${CATALOG_PROVIDER:-seed}
      CATALOG_REGIONS: ${CATALOG_REGIONS:-BR}
      CATALOG_SYNC_LIMIT: ${CATALOG_SYNC_LIMIT:-100}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-}
      APIFY_ACTOR_ID_BR: ${APIFY_ACTOR_ID_BR:-}
      APIFY_ACTOR_ID_US: ${APIFY_ACTOR_ID_US:-}
      APIFY_INPUT_JSON: ${APIFY_INPUT_JSON:-}
      APIFY_PRICE_DIVISOR: ${APIFY_PRICE_DIVISOR:-1}
      APIFY_PRICE_DIVISOR_BR: ${APIFY_PRICE_DIVISOR_BR:-}
      APIFY_PRICE_DIVISOR_US: ${APIFY_PRICE_DIVISOR_US:-}
      APIFY_SEARCH_TERMS: ${APIFY_SEARCH_TERMS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      UPLOAD_DIR: /app/uploads
      PUBLIC_URL: ${PUBLIC_URL:-}
      COMMISSION_RATES_BR: ${COMMISSION_RATES_BR:-}
      COMMISSION_RATES_US: ${COMMISSION_RATES_US:-}
      CALODATA_API_KEY: ${CALODATA_API_KEY:-}
      CALODATA_BASE_URL: ${CALODATA_BASE_URL:-https://api.kalodata.com/v1}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - liberdade

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    networks:
      - liberdade

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - liberdade

networks:
  liberdade:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  uploads:
